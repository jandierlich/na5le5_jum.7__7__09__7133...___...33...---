<style>@view-transition{navigation:auto}.wzi{display:inline-block;width:1.2em;height:1.2em;vertical-align:-0.22em;fill:currentColor;flex-shrink:0}.wzi-red{color:#DC2626}.wzi-green{color:#16A34A}.wzi-yellow{color:#EAB308}.wzi-orange{color:#EA8C1E}.wzi-white{color:#9C9CA8}.wzi-chev-up{transform:rotate(-90deg)}.wzi-chev-down{transform:rotate(90deg)}
  [hidden]{display:none!important}
  :root{
    --bg:var(--wzp-f1eefa, #F1EEFA); --card:var(--wzp-f8f6fc, #F8F6FC); --card2:var(--wzp-dac7f2, #DAC7F2); --btn-warm:var(--wzp-dac7f2, #DAC7F2); --text:var(--wzp-241e3f, #241E3F); --sub:var(--wzp-524370, #524370); --sub-onbg:var(--wzp-4a3d56, #4A3D56);
    --border:var(--wzp-c7b3ec, #C7B3EC); --cta-bg:var(--wzp-5a2fbe, #5A2FBE); --cta-text:#FFFFFF;
    --shadow-dark-soft: rgba(var(--wzq-241e3f, 36, 30, 63),.16); --shadow-light-soft: rgba(255,255,255,.75);
  }
  html.theme-dark{
    --bg:var(--wzp-1e1b2e, #1E1B2E); --card:var(--wzp-2a2440, #2A2440); --card2:var(--wzp-3a2e52, #3A2E52); --btn-warm:var(--card2); --text:var(--wzp-eeeaf8, #EEEAF8); --sub:var(--wzp-c3b2f0, #C3B2F0); --sub-onbg:var(--wzp-c3b2f0, #C3B2F0);
    --border:var(--wzp-5c4c82, #5C4C82); --cta-bg:var(--wzp-b9a6f5, #B9A6F5); --cta-text:var(--wzp-241e3f, #241E3F);
    --shadow-dark-soft: rgba(0,0,0,.45); --shadow-light-soft: rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);width:100%;overflow-x:hidden;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;touch-action:manipulation}
  body{font-family:-apple-system,sans-serif;color:var(--text);line-height:1.5}
  .app{max-width:480px;margin:0 auto;min-height:var(--wz-vh, 100dvh);padding:0 16px 28px;position:relative}
  .safe-top{padding-top:calc(env(safe-area-inset-top) + 60px)}
  header{background:linear-gradient(150deg,var(--cta-bg) 0%,var(--wzp-241748, #241748) 100%);border-radius:0 0 30px 30px;padding:calc(env(safe-area-inset-top,0px) + 6px) 24px 26px;margin:calc(-1 * (env(safe-area-inset-top,0px) + 60px)) -16px 20px;text-align:center;position:relative;overflow:hidden}
  header::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10);top:-75px;right:-55px}
  header::after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-45px;left:30px}
  .logo-badge{position:relative}
  .logo-badge img{box-shadow:0 14px 30px rgba(var(--wzq-141023, 20, 16, 35),.35);border-radius:18px}
  .logo-badge{width:72px;height:72px;margin:0 auto 14px}
  .logo-badge img{width:100%;height:100%;display:block;object-fit:contain}
  header h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.01em;color:#fff;position:relative;font-family:ui-rounded,-apple-system,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  header p{font-size: 13.5px;color:rgba(255,255,255,.88);margin:8px 0 0;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.2)}

  .theme-toggle,.home-link{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:9999;width:40px;height:40px;border-radius:20px;border:1px solid rgba(120,120,128,0.3);background:rgba(255,255,255,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;text-align:center;line-height:38px;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.12);text-decoration:none;color:var(--wzp-241e3f, #241E3F)}
  .theme-toggle{right:16px}
  .home-link{right:64px}
  @media (min-width:640px){.theme-toggle{right:calc(50vw - 195px + 16px) !important}.home-link{right:calc(50vw - 195px + 64px) !important}}

  .cta{display:block;width:100%;padding:16px 14px;border-radius:16px;border:none;background:var(--btn-warm);color:var(--text);font-size:16px;font-weight:700;font-family:inherit;text-align:center;cursor:pointer}
  .cta.secondary{background:var(--btn-warm);color:var(--text)}
  .cta:active{opacity:.85}

  .hint-card{background:var(--card2);border-radius:16px;padding:14px 16px;font-size: 13.5px;color:var(--sub-onbg);margin-top:16px;text-align:center}

  .result-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:18px;box-shadow:6px 6px 14px var(--shadow-dark-soft),-6px -6px 14px var(--shadow-light-soft)}
  html.theme-dark .result-card{background:var(--card)}
  .result-card .label{font-size: 13.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub-onbg);font-weight:600;margin-bottom:8px}
  .result-card .content{font-size:15px;word-break:break-all;white-space:pre-wrap;margin-bottom:14px}
  .result-card .btnrow{display:flex;gap:8px}
  .result-card .btnrow .cta{padding:12px}
  .copied{font-size: 13.5px;color:var(--sub-onbg);text-align:center;margin-top:8px;height:16px}

  /* Scan-Ansicht */
  .scan-view{position:fixed;inset:0;background:#000;z-index:9998;display:flex;flex-direction:column}
  .scan-view[hidden]{display:none}
  .scan-video-wrap{flex:1;position:relative;overflow:hidden}
  .scan-video-wrap video{width:100%;height:100%;object-fit:cover}
  .scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(70vw,280px);height:min(70vw,280px);border:3px solid rgba(255,255,255,0.85);border-radius:24px;box-shadow:0 0 0 2000px rgba(0,0,0,0.35)}
  .scan-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);left:0;right:0;text-align:center;color:#fff;font-size: 14.5px;padding:0 24px}
  .scan-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;width:40px;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:#fff;font-size:18px;text-align:center;line-height:38px;padding:0;cursor:pointer}

  footer{text-align:center;padding:22px 0 6px;font-size:14px;font-weight:600;color:var(--text)}
  footer a{color:var(--text);text-decoration:underline}
</style>

<script>function wzIcon(id,cls){return '<svg class="wzi'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#wzi-'+id+'"></use></svg>';}</script>
<script>
(function(){

  // ---------- Einführung (einheitlich über wz-onboarding.js) ----------
  var onb = wzOnboarding({
    key: "qr_onboarded",
    slides: [
      {icon:"camera", title:"Willkommen bei QRWahr", text:"Der unabhängige QR-Scanner: Code scannen, Inhalt in Ruhe ansehen – und erst dann entscheiden, was passiert."},
      {icon:"lock", title:"Nichts öffnet sich von selbst", text:"Links, Telefonnummern oder WLAN-Daten werden nur angezeigt. Öffnen oder kopieren tust du selbst – per Tipp auf „Extern öffnen“ oder „Kopieren“."},
      {icon:"check", title:"100% lokal", text:"Die Kamera läuft nur, solange der Scan-Bildschirm offen ist. Bilder und Ergebnisse werden weder gespeichert noch übertragen."}
    ]
  });
  document.getElementById("btnShowOnboarding").addEventListener("click", function(){ onb.show(); });

  // ---------- QR-Scan (unabhängig, keine Verbindung zu anderen Apps/Datenbanken) ----------
  var scanView = document.getElementById("scanView");
  var scanVideo = document.getElementById("scanVideo");
  var scanHint = document.getElementById("scanHint");
  var resultCard = document.getElementById("resultCard");
  var resultContent = document.getElementById("resultContent");
  var btnOpenExternal = document.getElementById("btnOpenExternal");
  var btnCopy = document.getElementById("btnCopy");
  var copiedHint = document.getElementById("copiedHint");
  var codeReader = null;
  var lastText = null;

  function loadZXing(){
    return new Promise(function(resolve, reject){
      if(window.ZXing){ resolve(); return; }
      var s = document.createElement("script");
      s.src = "./lib-zxing-0.21.3.min.js";
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function isLikelyUrl(text){
    if(!text) return false;
    var t = text.trim();
    return /^https?:\/\//i.test(t) || /^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(t.split(/\s/)[0]);
  }
  function toOpenableUrl(text){
    var t = text.trim();
    if(/^https?:\/\//i.test(t)) return t;
    return "https://" + t;
  }

  function showResult(text){
    lastText = text;
    resultContent.textContent = text;
    if(isLikelyUrl(text)){
      btnOpenExternal.hidden = false;
    } else {
      btnOpenExternal.hidden = true;
    }
    copiedHint.textContent = "";
    resultCard.hidden = false;
    resultCard.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function openScan(){
    scanView.hidden = false;
    scanHint.textContent = "QR-Code in den Rahmen halten";
    loadZXing().then(function(){
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]);
      codeReader = new ZXing.BrowserMultiFormatReader(hints);
      codeReader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}}, scanVideo, function(result){
        if(result){
          closeScan();
          showResult(result.getText());
        }
      }).catch(function(){
        scanHint.textContent = "Kamerazugriff nicht möglich. Bitte Berechtigung erlauben.";
      });
    }).catch(function(){
      scanHint.textContent = "Scanner konnte nicht geladen werden.";
    });
  }
  function closeScan(){
    if(codeReader){ try{ codeReader.reset(); }catch(e){} codeReader = null; }
    scanView.hidden = true;
  }

  document.getElementById("btnStartScan").addEventListener("click", openScan);
  // Übergabe aus dem Scanner der Startseite: Inhalt nur anzeigen, nichts öffnen
  var wzH = window.wzScanHandoff && wzScanHandoff(["qr"]);
  if(wzH && wzH.text) showResult(String(wzH.text));
  document.getElementById("btnCloseScan").addEventListener("click", closeScan);

  btnOpenExternal.addEventListener("click", function(){
    if(lastText) window.open(toOpenableUrl(lastText), "_blank", "noopener,noreferrer");
  });
  btnCopy.addEventListener("click", function(){
    if(!lastText) return;
    var done = function(){ copiedHint.textContent = "In Zwischenablage kopiert."; setTimeout(function(){ copiedHint.textContent=""; }, 2000); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lastText).then(done).catch(function(){ copiedHint.textContent = "Kopieren nicht möglich."; });
    } else {
      copiedHint.textContent = "Kopieren nicht möglich.";
    }
  });
})();


</script>
</body>
</html>
